{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <h2>Lie Detection Camera</h2>
        <img src="{% url 'video_feed' %}" width="640" height="480">
    </div>
    <div class="col-md-6">
        <h3>Analysis Results</h3>
        <div id="results">
            <!-- Hasil analisis akan muncul di sini -->
        </div>
        <button id="start-btn" class="btn btn-primary">Start Analysis</button>
        <button id="stop-btn" class="btn btn-danger">Stop</button>
    </div>
</div>

<script>
document.getElementById('start-btn').addEventListener('click', function() {
    // Mengirim permintaan untuk mulai analisis
    fetch('/start-analysis/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({action: 'start'})
    });
});

// Kode untuk menerima hasil analisis real-time bisa menggunakan WebSocket
</script>
{% endblock %}
